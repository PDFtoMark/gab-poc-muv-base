name: PoC Mu Pr Validation Post

on:
  workflow_run:
    workflows: ["Mu QEMU PR Validation"]
    types: ["completed"]

permissions:
  actions: read
  contents: write

jobs:
  post-process:
    runs-on: ubuntu-latest
    steps:
      - name: Download PR Metadata from Triggering Run
        id: download-metadata
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mu-qemu-pr-metadata
          path: metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}

      - name: Probe Downloaded Metadata
        if: steps.download-metadata.outcome == 'success'
        run: |
          echo '--- attacker artifact content ---'
          cat metadata/pr-metadata.json

      - name: Parse PR Metadata
        if: steps.download-metadata.outcome == 'success'
        id: metadata
        shell: python3 {0}
        run: |
          import json
          import os
          import pathlib

          data = json.loads(pathlib.Path('metadata/pr-metadata.json').read_text(encoding='utf-8'))

          def write(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write(f"{name}={value}\n")

          write('pr_number', data.get('pr_number', ''))
          write('caller_ref', data.get('caller_ref', ''))
          write('platforms_json', json.dumps(data.get('platforms', {}), separators=(',', ':')))

      - name: Check PR State
        if: steps.download-metadata.outcome == 'success' && steps.metadata.outputs.pr_number != ''
        id: pr-state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.metadata.outputs.pr_number }}');
            if (!prNumber) {
              core.setOutput('merged_or_closed', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('merged_or_closed', pr.state !== 'open' ? 'true' : 'false');

      - name: Post Final PR Comment
        if: >-
          steps.download-metadata.outcome == 'success' &&
          steps.pr-state.outputs.merged_or_closed != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = parseInt('${{ steps.metadata.outputs.pr_number }}');
            const callerRef = '${{ steps.metadata.outputs.caller_ref }}';
            const shortSha = callerRef.substring(0, 7);
            const platforms = JSON.parse('${{ steps.metadata.outputs.platforms_json }}' || '{}');
            core.info('shortSha=' + shortSha + ' platforms=' + JSON.stringify(platforms));
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: 'validation comment from post workflow',
            });
